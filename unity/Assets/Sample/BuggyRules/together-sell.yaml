# 이 규칙은 실패하는 것이 정상이다. 샘플의 판매 팝업에는 확인과 취소를 동시에 누르면 둘 다 처리되는 버그를 일부러 심어 두었다.
# 둘 중 하나만 처리되어야 하므로, 팝업이 닫힌 뒤 열린 팝업 수는 0이어야 한다
name: 판매 확인과 취소 동시 클릭
---
- tapOn: { name: SellButton }
- tapTogether: [ { name: ConfirmButton }, { name: CancelButton } ]
- assertNotVisible: { name: SellPopup }
- assertValue: { popups: 0 }
